# Configuration for Shortify AI Agents
# Supports switching between providers and models

rhythm_engineer:
  provider: "librosa" # librosa is local, no API needed
  model: "default"

media_analyst:
  provider: "google"
  primary_model: "gemini-2.5-flash"
  fallback_models:
    - "gemini-3-flash-preview"
    - "gemini-flash-lite-latest"

creative_director:
  provider: "groq"
  model: "llama-3.3-70b-versatile"
  ollama_timeout_seconds: 60
  fallback_models:
    - "deepseek-r1:8b"
    - "llama3.2-vision:latest"

subtitle_agent:
  provider: "openai-whisper" # Local whisper
  model_size: "base"
  device: "cpu"
  caption_style: "hormozi"

project_analyst:
  provider: "local"
  min_video_duration: 1.0
  frame_sample_count: 5
  sharpness_divisor: 500.0

safety_reviewer:
  provider: "rule-based" # Local logic
  model: "safe-zone-v1"

video_editor:
  default_beat_snap_tolerance: 0.2
  beat_snap_tolerances:
    "speed-ramp": 0.1
    "jump-cut": 0.2
    "cinematic-slow": 0.3
  original_audio_volume: 1.0
  music_volume: 0.22
  music_ducked_volume: 0.06

caption_styles:
  minimal:
    font_size: 32
    font_color: "white"
    outline_color: "none"
    back_color: "none"
    position_y_ratio: 0.85
    uppercase: false
    animate: false
  bold:
    font_size: 52
    font_color: "white"
    outline_color: "black"
    outline_width: 4
    back_color: "none"
    position_y_ratio: 0.80
    uppercase: true
    animate: false
  hormozi:
    font_size: 44
    font_color: "yellow"
    inactive_color: "white"
    outline_color: "none"
    back_color: "black@0.5"
    shadow_color: "black"
    shadow_width: 2
    position_y_ratio: 0.80
    uppercase: true
    animate: true
  subtitle:
    font_size: 28
    font_color: "white"
    outline_color: "none"
    back_color: "black"
    position_y_ratio: 0.90
    uppercase: false
    animate: false

