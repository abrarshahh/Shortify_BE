# Configuration for Shortify AI Agents
# Supports switching between providers and models

rhythm_engineer:
  provider: "librosa" # librosa is local, no API needed
  model: "default"

media_analyst:
  provider: "google"
  primary_model: "gemini-2.5-flash"
  fallback_models:
    - "gemini-3-flash-preview"
    - "gemini-flash-lite-latest"

creative_director:
  provider: "groq"
  model: "llama-3.3-70b-versatile"

subtitle_agent:
  provider: "openai-whisper" # Local whisper
  model_size: "base"
  device: "cpu"

video_editor:
  provider: "local"
  default_fade_duration: 0.3
  original_audio_volume: 0.3
  music_volume: 0.9

color_grading:
  enabled: true
  ffmpeg_path: "ffmpeg"

project_analyst:
  provider: "local"
  min_video_duration: 1.0
  frame_sample_count: 5
  sharpness_divisor: 500.0

safety_reviewer:
  provider: "rule-based" # Local logic
  model: "safe-zone-v1"
